{# Шаблон для просмотра полного содержания темы и тела письма. #}
{% extends 'main/base.html' %}

{% block title %}{{ object.title }}{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="border-bottom pb-2">{{ object.title }}</h2>
        <div class="p-3 bg-white border rounded" style="white-space: pre-wrap;">{{ object.body }}</div>
        <div class="mt-3">
            <a href="{% url 'main:message_update' object.pk %}" class="btn btn-warning text-white">Редактировать</a>
            <a href="{% url 'main:message_list' %}" class="btn btn-secondary">Назад к списку</a>
        </div>
    </div>
</div>
{% endblock %}
