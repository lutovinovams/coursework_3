{# Страница входа в систему #}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="card shadow mx-auto" style="width: 400px;">
        <div class="card-header bg-dark text-white text-center"><h4>Авторизация</h4></div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 mt-2">Войти</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'users:register' %}" class="small">Регистрация аккаунта</a> | 
                <a href="{% url 'users:password_reset' %}" class="small">Забыли пароль?</a>
            </div>
        </div>
    </div>
</body>
</html>
