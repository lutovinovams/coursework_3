{# Форма восстановления пароля #}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="card shadow mx-auto" style="width: 400px;">
        <div class="card-header bg-danger text-white text-center"><h4>Восстановление пароля</h4></div>
        <div class="card-body">
            {% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Введите ваш зарегистрированный Email:</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Сбросить пароль</button>
            </form>
            <div class="text-center mt-3"><a href="{% url 'users:login' %}" class="small">Назад к авторизации</a></div>
        </div>
    </div>
</body>
</html>
